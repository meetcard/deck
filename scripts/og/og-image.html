<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Literal hex rather than var(--deck-*): this renders standalone in a
     headless browser with no access to Deck's stylesheet. Values are the
     light-mode primitives — paper, ink, mist-deep, signal-green. */
  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #faf8f4;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Scattered cards, not clusters: individually placed rounded rects at
     gentle angles, several running off the frame. Pale enough to sit behind
     the type without competing — signal green at ~9% over paper. */
  .card {
    position: absolute;
    background: #2e6e5b;
    opacity: 0.08;
    border-radius: 34px;
  }

  .lockup {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 34px;
  }
  .lockup svg { display: block; height: 76px; width: auto; }

  .headline {
    position: relative;
    font-size: 62px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: #1a1a1a;
    text-align: center;
  }

  .sub {
    position: relative;
    margin-top: 26px;
    max-width: 700px;
    font-size: 24px;
    line-height: 1.45;
    color: #565c5a;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card" style="left:-170px;top:-200px;width:300px;height:380px;transform:rotate(12deg)"></div>
  <div class="card" style="left:220px;top:-300px;width:280px;height:350px;transform:rotate(-16deg)"></div>
  <div class="card" style="left:900px;top:-250px;width:300px;height:380px;transform:rotate(14deg)"></div>
  <div class="card" style="left:1120px;top:20px;width:280px;height:350px;transform:rotate(-9deg)"></div>
  <div class="card" style="left:-210px;top:290px;width:300px;height:380px;transform:rotate(-13deg)"></div>
  <div class="card" style="left:160px;top:530px;width:280px;height:350px;transform:rotate(11deg)"></div>
  <div class="card" style="left:850px;top:510px;width:300px;height:380px;transform:rotate(15deg)"></div>
  <div class="card" style="left:1130px;top:310px;width:280px;height:350px;transform:rotate(-11deg)"></div>

  <div class="lockup" id="lockup"><!-- deckWordmarkSvg injected here --></div>
  <h1 class="headline">Build with Deck.</h1>
  <p class="sub">Accessible, card-centric UI library designed for clean and highly composable digital experiences.</p>
</body>
</html>
