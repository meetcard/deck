# Deploys deck.meetcard.io, not the npm package:
#   /           → the Astro landing page (src/site → dist/site)
#   /storybook/ → the browsable Storybook UI (storybook-static)
#
# `npm run build` builds the @meetcard/deck library bundle for consumers
# (vite.lib.config.ts, outputs dist/deck.js — no HTML entry point), so it is
# deliberately not part of this command.
#
# Astro requires Node >=22.12; without NODE_VERSION Netlify's default may be
# older and `astro build` refuses to run.
[build]
  command = "npm run build:site && npm run build-storybook && mkdir -p dist/site/storybook && cp -R storybook-static/. dist/site/storybook/"
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "22"
