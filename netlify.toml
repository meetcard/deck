# Deploys both the Astro landing page (at /) and Storybook (at /storybook)
# Astro output: dist/site/
# Storybook output: storybook-static/ → published to dist/site/storybook/
[build]
  command = "npm run build:site && npm run build-storybook && mkdir -p dist/site/storybook && cp -r storybook-static/* dist/site/storybook/ || true"
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "22"

# Storybook iframe.html is served from /storybook subdirectory
# but iframe links reference /storybook paths correctly
[[redirects]]
  from = "/storybook/*"
  to = "/storybook/:splat"
  status = 200
