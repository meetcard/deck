name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Job-level so the Chromatic step's `if` can read it. Forks and repos
    # without the secret configured skip publishing instead of failing.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full history to compare against the baseline.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Story tests run in real Chromium via the Vitest browser provider.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # axe over every story in BOTH color schemes. `npm test` only covers
      # the default (light) scheme; Deck's dark palette is derived, so it
      # needs its own gate.
      - name: Accessibility sweep (light + dark)
        run: node scripts/a11y-sweep.mjs --static storybook-static

      # Publishes the built Storybook and runs visual regression.
      # Requires the CHROMATIC_PROJECT_TOKEN repository secret.
      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        run: npx chromatic --storybook-build-dir=storybook-static --exit-zero-on-changes
